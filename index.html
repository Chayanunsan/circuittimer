<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Circuit Timer</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); 
            transition: all 0.3s ease;
        }

        /* เมื่อเข้าสู่หน้าออกกำลังกาย ปรับ Container ให้สูงโปร่งเพื่อรองรับตัวเลขใหญ่พิเศษ */
        .container.workout-mode {
            max-width: 600px;
            height: 80vh;
            min-height: 550px;
            display: flex;
            flex-direction: column;
        }

        /* --- Utilities --- */
        .hidden {
            display: none !important;
        }

        /* --- Typography & Elements --- */
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #666666;
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        input[type="number"]:focus {
            border-color: #1a1a1a;
            background-color: #ffffff;
        }

        /* --- Buttons --- */
        .btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #22c55e; /* เขียว */
            color: #ffffff;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #16a34a;
        }

        .btn-grey {
            background-color: #f3f4f6; /* เทา */
            color: #1a1a1a;
        }

        .btn-grey:hover {
            background-color: #e5e7eb;
        }

        /* ================= จัดสัดส่วนหน้าออกกำลังกายตามเงื่อนไข ================= */
        #workout-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* ส่วนที่ 1: ส่วนรอบและปุ่มควบคุม (10%) */
        .header-bar {
            height: 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ส่วนที่ 2: ส่วนบอกชื่อท่า / สถานะ (10%) */
        .status-label {
            height: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(22px, 3.5vh, 32px); /* ปรับขนาดตามความสูงจอ */
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
        }

        /* ส่วนที่ 3: ส่วนพื้นที่ตัวเลขนับถอยหลัง (80%) */
        .timer-display {
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ตัวเลขขนาดใหญ่พิเศษ คำนวณขนาดตามความสูงของหน้าจอ (vh) */
        .countdown-number {
            font-size: clamp(140px, 42vh, 320px); 
            font-weight: 800;
            line-height: 1;
            color: #1a1a1a;
            letter-spacing: -4px;
            user-select: none;
        }

        /* --- ของตกแต่งอื่นๆ --- */
        .round-display {
            font-size: 15px;
            font-weight: 600;
            color: #666666;
            background: #f3f4f6;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: #f3f4f6;
            color: #1a1a1a;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background-color: #e5e7eb;
        }

        .btn-icon.exit {
            background-color: #f3f4f6;
            color: #ef4444;
        }
        .btn-icon.exit:hover {
            background-color: #fee2e2;
        }

        /* สีสถานะ */
        .status-warmup { color: #9ca3af; } /* เทา */
        .status-work { color: #22c55e; }   /* เขียว */
        .status-rest { color: #ef4444; }   /* แดง */
        .status-rest-round { color: #3b82f6; } /* น้ำเงิน */

        /* หน้าสรุปผล */
        .summary-screen {
            text-align: center;
            padding: 20px 0;
        }
        .summary-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div id="main-container" class="container">
        <!-- ================= หน้าตั้งค่า (Setup Screen) ================= -->
        <div id="setup-screen">
            <h1>Circuit Setup</h1>

            <div class="form-group">
                <label for="warmup-time">เวลาอบอุ่นร่างกาย / เตรียมตัวก่อนเริ่ม (วินาที)</label>
                <input type="number" id="warmup-time" min="0" value="10">
            </div>
            
            <div class="form-group">
                <label for="num-exercises">จำนวนท่าทั้งหมด (ท่า)</label>
                <input type="number" id="num-exercises" min="1" value="5">
            </div>

            <div class="form-group">
                <label for="work-time">เวลาต่อหนึ่งท่า (วินาที)</label>
                <input type="number" id="work-time" min="1" value="30">
            </div>

            <div class="form-group">
                <label for="rest-exercise">เวลาพักระหว่างท่า (วินาที)</label>
                <input type="number" id="rest-exercise" min="0" value="15">
            </div>

            <div class="form-group">
                <label for="rest-round">เวลาพักระหว่างรอบ (วินาที)</label>
                <input type="number" id="rest-round" min="0" value="60">
            </div>

            <div class="form-group">
                <label for="num-rounds">จำนวนรอบทั้งหมด (รอบ)</label>
                <input type="number" id="num-rounds" min="1" value="3">
            </div>

            <button id="start-btn" class="btn btn-primary">เริ่มออกกำลังกาย</button>
        </div>

        <!-- ================= หน้าออกกำลังกาย (Workout Screen) ================= -->
        <div id="workout-screen" class="hidden">
            <!-- ส่วนที่ 1: 10% ด้านบน -->
            <div class="header-bar">
                <div id="round-title" class="round-display">รอบที่ 1 / 3</div>
                <div class="controls">
                    <button id="pause-play-btn" class="btn-icon">❚❚</button>
                    <button id="exit-btn" class="btn-icon exit">✕</button>
                </div>
            </div>

            <!-- ส่วนที่ 2: 10% ถัดมา -->
            <div id="status-text" class="status-label">ท่าที่ 1 / 5</div>

            <!-- ส่วนที่ 3: 80% ที่เหลือด้านล่าง -->
            <div class="timer-display">
                <div id="countdown" class="countdown-number">30</div>
            </div>
        </div>

        <!-- ================= หน้าจบการทำงาน (Summary Screen) ================= -->
        <div id="summary-screen" class="hidden summary-screen">
            <div class="summary-icon">🎉</div>
            <h1>ยอดเยี่ยมมาก!</h1>
            <p style="color: #666666; margin-bottom: 24px;">คุณออกกำลังกายครบตามเป้าหมายแล้ว</p>
            <button id="back-to-setup-btn" class="btn btn-grey">กลับหน้าตั้งค่า</button>
        </div>
    </div>

    <!-- ================= ระบบควบคุม (JavaScript) ================= -->
    <script>
        // --- ส่วนการจัดการ State และตัวแปร ---
        let config = {
            warmupTime: 10,
            numExercises: 5,
            workTime: 30,
            restExercise: 15,
            restRound: 60,
            numRounds: 3
        };

        let currentRound = 1;
        let currentExercise = 1;
        let currentPhase = 'warmup'; 
        let timeLeft = 0;
        let timerInterval = null;
        let isPaused = false;

        // --- DOM Elements ---
        const mainContainer = document.getElementById('main-container');
        const setupScreen = document.getElementById('setup-screen');
        const workoutScreen = document.getElementById('workout-screen');
        const summaryScreen = document.getElementById('summary-screen');

        // Inputs
        const inputWarmupTime = document.getElementById('warmup-time');
        const inputNumExercises = document.getElementById('num-exercises');
        const inputWorkTime = document.getElementById('work-time');
        const inputRestExercise = document.getElementById('rest-exercise');
        const inputRestRound = document.getElementById('rest-round');
        const inputNumRounds = document.getElementById('num-rounds');

        // Display Components
        const roundTitle = document.getElementById('round-title');
        const statusText = document.getElementById('status-text');
        const countdownDisplay = document.getElementById('countdown');
        
        // Buttons
        const startBtn = document.getElementById('start-btn');
        const pausePlayBtn = document.getElementById('pause-play-btn');
        const exitBtn = document.getElementById('exit-btn');
        const backToSetupBtn = document.getElementById('back-to-setup-btn');

        // --- ฟังก์ชันเสียงบี๊บ (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(frequency, duration) {
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio Web API Error");
            }
        }

        // --- โหลดและบันทึก Local Storage ---
        function loadSettings() {
            const savedConfig = localStorage.getItem('circuit_timer_v3_config');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
                inputWarmupTime.value = config.warmupTime !== undefined ? config.warmupTime : 10;
                inputNumExercises.value = config.numExercises;
                inputWorkTime.value = config.workTime;
                inputRestExercise.value = config.restExercise;
                inputRestRound.value = config.restRound;
                inputNumRounds.value = config.numRounds;
            }
        }

        function saveSettings() {
            config.warmupTime = parseInt(inputWarmupTime.value) || 0;
            config.numExercises = parseInt(inputNumExercises.value) || 1;
            config.workTime = parseInt(inputWorkTime.value) || 1;
            config.restExercise = parseInt(inputRestExercise.value) || 0;
            config.restRound = parseInt(inputRestRound.value) || 0;
            config.numRounds = parseInt(inputNumRounds.value) || 1;

            localStorage.setItem('circuit_timer_v3_config', JSON.stringify(config));
        }

        // --- อัปเดต UI หน้าออกกำลังกายตามช่วงเวลา ---
        function updateUI() {
            roundTitle.textContent = `รอบที่ ${currentRound} / ${config.numRounds}`;
            countdownDisplay.textContent = timeLeft;

            statusText.className = 'status-label'; 
            
            if (currentPhase === 'warmup') {
                statusText.textContent = `เตรียมตัว / Warm up`;
                statusText.classList.add('status-warmup');
            } else if (currentPhase === 'work') {
                statusText.textContent = `ท่าที่ ${currentExercise} / ${config.numExercises}`;
                statusText.classList.add('status-work');
            } else if (currentPhase === 'rest_exercise') {
                statusText.textContent = `พักระหว่างท่า`;
                statusText.classList.add('status-rest');
            } else if (currentPhase === 'rest_round') {
                statusText.textContent = `พักระหว่างรอบ`;
                statusText.classList.add('status-rest-round');
            }
        }

        // --- ระบบเล่นเวลานับถอยหลังหลัก ---
        function runTimer() {
            if (isPaused) return;

            if (timeLeft > 0) {
                if (timeLeft <= 4 && timeLeft > 1) {
                    playBeep(440, 0.1); 
                } else if (timeLeft === 1) {
                    playBeep(880, 0.3); 
                }
                timeLeft--;
                countdownDisplay.textContent = timeLeft;
            } else {
                transitionPhase();
            }
        }

        // --- จัดการสลับเฟสการออกกำลังกาย ---
        function transitionPhase() {
            if (currentPhase === 'warmup') {
                currentPhase = 'work';
                timeLeft = config.workTime;
            } else if (currentPhase === 'work') {
                if (currentExercise === config.numExercises) {
                    if (currentRound === config.numRounds) {
                        endWorkout(true); 
                        return;
                    } else {
                        currentPhase = 'rest_round';
                        timeLeft = config.restRound;
                    }
                } else {
                    currentPhase = 'rest_exercise';
                    timeLeft = config.restExercise;
                }
            } else if (currentPhase === 'rest_exercise') {
                currentExercise++;
                currentPhase = 'work';
                timeLeft = config.workTime;
            } else if (currentPhase === 'rest_round') {
                currentRound++;
                currentExercise = 1;
                currentPhase = 'work';
                timeLeft = config.workTime;
            }
            updateUI();
        }

        // --- เริ่มต้นออกกำลังกาย ---
        function startWorkout() {
            saveSettings();
            
            currentRound = 1;
            currentExercise = 1;
            isPaused = false;
            pausePlayBtn.textContent = '❚❚';

            if (config.warmupTime > 0) {
                currentPhase = 'warmup';
                timeLeft = config.warmupTime;
            } else {
                currentPhase = 'work';
                timeLeft = config.workTime;
            }

            // เปิดโหมดออกกำลังกายเพื่อปรับความสูงของ Container
            mainContainer.classList.add('workout-mode');
            setupScreen.classList.add('hidden');
            summaryScreen.classList.add('hidden');
            workoutScreen.classList.remove('hidden');

            updateUI();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(runTimer, 1000);
        }

        // --- จบหรือออกจากการทำงาน ---
        function endWorkout(isCompleted = false) {
            clearInterval(timerInterval);
            mainContainer.classList.remove('workout-mode'); // ปล่อยความสูงกลับไปเท่าเดิม
            workoutScreen.classList.add('hidden');

            if (isCompleted) {
                summaryScreen.classList.remove('hidden');
            } else {
                setupScreen.classList.remove('hidden');
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pausePlayBtn.textContent = '▶';
                pausePlayBtn.style.color = '#22c55e';
            } else {
                pausePlayBtn.textContent = '❚❚';
                pausePlayBtn.style.color = '#1a1a1a';
            }
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', startWorkout);
        pausePlayBtn.addEventListener('click', togglePause);
        
        exitBtn.addEventListener('click', () => {
            if (confirm('คุณต้องการหยุดและกลับไปหน้าตั้งค่าใช่หรือไม่?')) {
                endWorkout(false);
            }
        });

        backToSetupBtn.addEventListener('click', () => {
            summaryScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });

        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
